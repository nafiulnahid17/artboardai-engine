[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "artboard-ai-engine"
version = "0.1.0"
description = "Headless artwork analysis, OCR, vector tracing and jersey print-file preparation."
requires-python = ">=3.11"
dependencies = [
  "Pillow>=12.0", "vtracer==0.6.15", "svgpathtools>=1.7",
  "defusedxml>=0.7.1", "pydantic>=2.10", "numpy>=2",
  "opencv-python-headless>=4.10", "openai>=2",
  "fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.20",
  "fonttools>=4.55", "uharfbuzz>=0.50",
  "pypdf>=6",
]

[project.scripts]
artboard-engine = "artboard_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["artboard_engine*"]

[tool.setuptools.package-data]
artboard_engine = ["desktop_templates/*.jsx"]
