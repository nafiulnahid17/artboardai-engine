name: Engine checks
on: [push, pull_request]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System tools
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr ghostscript
      - name: Install engine
        run: python -m pip install .
      - name: AI provider fallback tests
        run: python -m unittest discover -s tests -v
      - name: Engine smoke checks
        run: python scripts/smoke.py
      - name: Production workflow software checks
        run: |
          curl -Lf https://raw.githubusercontent.com/ArtifexSoftware/ghostpdl/master/iccprofiles/default_cmyk.icc -o /tmp/generic-test-cmyk.icc
          python scripts/production_checks.py --test-profile /tmp/generic-test-cmyk.icc
      - name: Preserve diagnostic outputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-smoke-diagnostics
          path: generated-artifacts/
